server:
  port: 8080
spring:
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD}
      connect-timeout: 2s
      timeout: 2s
  application:
    name: app-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:nacos:8848}
        namespace: application
        group: DEFAULT_GROUP
management:
  endpoints:
    web:
      exposure:
        include: health
spring.cloud.gateway:
  httpclient:
    connect-timeout: 2000
    response-timeout: 8s
  routes:
    - id: app-login
      uri: lb://app-service
      predicates:
        - Path=/api/auth/login
        - Method=POST
      filters:
        - AddResponseHeader=X-Lab-App-Gateway, visited
    - id: app-tickets
      uri: lb://app-service
      predicates:
        - Path=/api/tickets/**
      filters:
        - AddResponseHeader=X-Lab-App-Gateway, visited
    - id: app-auth
      uri: lb://app-service
      predicates:
        - Path=/api/auth/**
      filters:
        - AddResponseHeader=X-Lab-App-Gateway, visited

# 本机学习阈值，计数保存在 Redis；修改后重新构建应用网关镜像。
lab.rate:
  login:
    limit: 10
    window-seconds: 30
  tickets:
    limit: 20
    window-seconds: 10

