apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: nacos-data, namespace: novacloud-infra}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: nacos-config, namespace: novacloud-infra}
data:
  MODE: standalone
  PREFER_HOST_MODE: hostname
  NACOS_AUTH_ENABLE: 'false'
  JVM_XMS: 256m
  JVM_XMX: 512m
  JVM_XMN: 128m
---
apiVersion: v1
kind: Service
metadata: {name: nacos, namespace: novacloud-infra}
spec:
  selector: {app: nacos}
  ports:
    - {name: http, port: 8848, targetPort: 8848}
    - {name: client-grpc, port: 9848, targetPort: 9848}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: nacos, namespace: novacloud-infra}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: nacos}
  template:
    metadata:
      labels: {app: nacos, app.kubernetes.io/part-of: novacloud}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nacos
          image: nacos/nacos-server:v2.4.3
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8848}, {containerPort: 9848}]
          envFrom:
            - configMapRef: {name: nacos-config}
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /home/nacos/data}
          startupProbe:
            httpGet: {path: /nacos/v1/console/health/readiness, port: 8848}
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /nacos/v1/console/health/readiness, port: 8848}
            periodSeconds: 5
            timeoutSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: nacos-data}
