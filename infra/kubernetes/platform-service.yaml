apiVersion: v1
kind: Service
metadata: {name: platform-service, namespace: novacloud-platform}
spec:
  selector: {app: platform-service}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: platform-service, namespace: novacloud-platform}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: platform-service}
  template:
    metadata:
      labels: {app: platform-service, app.kubernetes.io/part-of: novacloud}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: platform-service
          image: novacloud-lab/platform-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          envFrom:
            - configMapRef: {name: java-config}
            - secretRef: {name: platform-credentials}
          env:
            - {name: MYSQL_USER, value: lab}
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql.novacloud-infra.svc.cluster.local:3306/novacloud?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectTimeout=2000&socketTimeout=4000
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 768Mi}
          startupProbe:
            httpGet: {path: /actuator/health, port: 8080}
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /actuator/health, port: 8080}
            periodSeconds: 5
            timeoutSeconds: 4
