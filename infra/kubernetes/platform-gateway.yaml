apiVersion: v1
kind: Service
metadata: {name: platform-gateway, namespace: novacloud-platform}
spec:
  selector: {app: platform-gateway}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: platform-gateway, namespace: novacloud-platform}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: platform-gateway}
  template:
    metadata:
      labels: {app: platform-gateway, app.kubernetes.io/part-of: novacloud}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: platform-gateway
          image: novacloud-lab/platform-gateway:0.1.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          envFrom:
            - configMapRef: {name: java-config}
            - secretRef: {name: redis-credentials}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 768Mi}
          startupProbe:
            httpGet: {path: /actuator/health, port: 8080}
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /actuator/health, port: 8080}
            periodSeconds: 5
            timeoutSeconds: 4
