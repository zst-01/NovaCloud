apiVersion: v1
kind: Service
metadata: {name: nginx, namespace: novacloud-app}
spec:
  selector: {app: nginx}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: nginx, namespace: novacloud-app}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: nginx}
  template:
    metadata:
      labels: {app: nginx, app.kubernetes.io/part-of: novacloud}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 80}]
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true}
            - {name: frontend, mountPath: /usr/share/nginx/html, readOnly: true}
          readinessProbe:
            httpGet: {path: /health, port: 80}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 80}
            periodSeconds: 10
      volumes:
        - name: config
          configMap: {name: nginx-config}
        - name: frontend
          configMap: {name: frontend}
