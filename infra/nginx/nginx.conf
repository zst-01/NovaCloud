events {}
http {
  log_format trace escape=json '{"time":"$time_iso8601","event":"request_complete",'
      '"service":"nginx","traceId":"$request_id","method":"$request_method",'
      '"path":"$uri","status":$status,"durationSec":$request_time}';
  access_log /dev/stdout trace;
  error_log /dev/stderr warn;
  server {
    listen 80;
    # 每个外部请求由入口生成新编号，包括入口自身产生的错误响应。
    add_header X-Trace-Id $request_id always;
    location /api/ {
      proxy_pass http://app-gateway:8080;
      proxy_set_header X-Trace-Id $request_id;
      # 隐藏上游同名响应头，由入口统一返回一个编号。
      proxy_hide_header X-Trace-Id;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 2s;
      proxy_read_timeout 10s;
      add_header X-Lab-Nginx visited always;
      # location 自己声明 add_header 后不会继承 server 层的 add_header。
      add_header X-Trace-Id $request_id always;
    }
    location = /health { access_log off; return 200 'ok'; }
    location / { return 404; }
  }
}
