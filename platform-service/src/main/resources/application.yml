server:
  port: 8080
logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
spring:
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD}
      connect-timeout: 2s
      timeout: 2s
  application:
    name: platform-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:nacos:8848}
        namespace: platform
        group: DEFAULT_GROUP
management:
  endpoint:
    health:
      show-components: always
  endpoints:
    web:
      exposure:
        include: health
spring.datasource:
  url: jdbc:mysql://mysql:3306/novacloud?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectTimeout=2000&socketTimeout=4000
  username: ${MYSQL_USER}
  password: ${MYSQL_PASSWORD}
  hikari:
    maximum-pool-size: 5
    connection-timeout: 3000
